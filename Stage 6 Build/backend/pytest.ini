[pytest]
testpaths = tests
markers =
    integration: exercises a full API endpoint through the real app + a real (rolled-back) Postgres transaction.
    simulated: exercises a deliberately-simulated integration (OTP delivery, mobile money, USSD/SMS) -- asserts it behaves correctly AND stays clearly marked as simulated, never treated as production-ready.
    e2e: drives a real browser (Playwright) against the actual served frontend, not just the API.
    unit: exercises a single shared computation module in isolation (formula/dispatch/reconciliation/wallet/payout/catalogue/otp/reporting math).
    rbac: systematic role-boundary matrix -- every GET endpoint x every role.
