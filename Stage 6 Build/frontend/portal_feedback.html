<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stakeholder Feedback — Farm Master</title>
<link rel="stylesheet" href="/static/assets/tokens.css">
<link rel="stylesheet" href="/static/assets/components.css">
<style>
  .fb-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .fb-tools select { min-height: 40px; }
  .fb-item { border-top: 1px solid var(--line-soft); padding: 14px 0; }
  .fb-item:first-child { border-top: 0; }
  .fb-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .fb-tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--cream); border: 1px solid var(--line-soft); font-weight: 600; color: var(--forest-deep); }
  .fb-msg { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header id="topbar"></header>
<main class="fm-app fm-screen" id="portal-main">
  <div class="portal-head">
    <div><h2>Stakeholder feedback</h2><div class="sub" id="who">Loading…</div></div>
    <span class="role-chip">Super Admin</span>
  </div>
  <section class="card" aria-labelledby="fb-title">
    <div class="fb-tools">
      <h3 id="fb-title" style="margin:0">All feedback <span id="fb-count" class="hint"></span></h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <select id="fb-portal" aria-label="Filter by portal"><option value="">All portals</option></select>
        <button class="btn" type="button" id="fb-csv">Download CSV</button>
      </div>
    </div>
    <div id="fb-list"><div class="hint">Loading…</div></div>
  </section>
</main>
<script src="/static/assets/components.js?v=2"></script>
<script>
(function () {
  "use strict";
  var $ = FM.$, esc = FM.esc;
  var TYPE = { suggestion: "Suggestion", problem: "Something's wrong", question: "Question", praise: "Praise" };
  var rows = [];

  FM.portal({
    active: "", role: "super_admin", roleLabel: "the Super Admin account", portalName: "feedback inbox",
    demoEmail: "emmanuel@farmmaster.test",
    onReady: function (me) { $("#who").textContent = "Signed in as " + (me.profile_line || me.full_name); load(); }
  });

  function load() {
    FM.get("/api/feedback").then(function (data) {
      rows = data;
      var portals = [];
      rows.forEach(function (r) { if (portals.indexOf(r.portal) < 0) portals.push(r.portal); });
      $("#fb-portal").innerHTML = '<option value="">All portals</option>' + portals.sort().map(function (p) { return '<option>' + esc(p) + "</option>"; }).join("");
      render();
    }).catch(function (e) { $("#fb-list").innerHTML = '<div class="notice error">' + esc(e.message) + "</div>"; });
    $("#fb-portal").addEventListener("change", render);
    $("#fb-csv").addEventListener("click", downloadCsv);
  }

  function render() {
    var portal = $("#fb-portal").value;
    var shown = rows.filter(function (r) { return !portal || r.portal === portal; });
    $("#fb-count").textContent = "(" + shown.length + ")";
    if (!shown.length) { $("#fb-list").innerHTML = '<div class="hint">No feedback yet. Every page has a Feedback button in the bottom-right corner.</div>'; return; }
    $("#fb-list").innerHTML = shown.map(function (r) {
      var who = r.name || r.user_name || "Anonymous";
      if (r.user_role) who += " · signed in as " + r.user_role.replace(/_/g, " ");
      return '<article class="fb-item"><div class="fb-meta"><span class="fb-tag">' + esc(TYPE[r.category] || r.category) + "</span>" +
        "<span>" + esc(r.portal) + " · <code>" + esc(r.page) + "</code></span>" +
        "<span>" + esc(new Date(r.created_at + "Z").toLocaleString()) + "</span><span>" + esc(who) + "</span></div>" +
        '<div class="fb-msg">' + esc(r.message) + "</div></article>";
    }).join("");
  }

  function downloadCsv() {
    var s = FM.session.get();
    fetch("/api/feedback/export.csv", { headers: { Authorization: "Bearer " + (s && s.token) } })
      .then(function (r) { if (!r.ok) throw new Error("Couldn't export the feedback."); return r.blob(); })
      .then(function (blob) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = "farm-master-feedback.csv";
        document.body.appendChild(a); a.click(); a.remove();
      })
      .catch(function (e) { $("#fb-list").insertAdjacentHTML("afterbegin", '<div class="notice error">' + esc(e.message) + "</div>"); });
  }
})();
</script>
</body>
</html>
